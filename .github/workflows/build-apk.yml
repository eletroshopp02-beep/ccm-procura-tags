name: Gerar APK - CCM Procura TAGs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          unzip -o CCM_Procura_TAGs_GITHUB_BUILD.zip
          find . -name "settings.gradle" -print

      - name: Compilar APK
        run: |
          cd CCM_Procura_TAGs_FINAL
          gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CCM-Procura-TAGs-APK
          path: CCM_Procura_TAGs_FINAL/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
